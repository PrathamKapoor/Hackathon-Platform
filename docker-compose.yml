# Verdict — hackathon operations with a defensible judging engine.
#
#   git clone … && cd … && docker compose up
#
# That is the whole setup. No `.env`, no secret to generate, no account to
# create: the service comes up on http://localhost:8080 with a seeded demo event
# so there is something to click before any configuration is done.
#
# The bundled SESSION_SECRET below is for local and demo use only. A real
# deployment MUST override it - see OPERATIONS.md. The application itself is
# unchanged in production: NODE_ENV=production with a missing or short secret is
# still a fatal boot error, and this default never reaches that check because
# compose supplies the variable.

services:
  verdict:
    build:
      context: .
      dockerfile: Dockerfile
    image: verdict:local
    container_name: verdict
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      # Overridable so `docker compose -f docker-compose.yml -f docker-compose.dev.yml`
      # can point at a mounted database for development.
      DATABASE_FILE: /data/verdict.db
      STORAGE_DIR: /data/uploads
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      # LOCAL DEMO SECRET - DO NOT USE IN PRODUCTION.
      # 64 characters of base64url, generated once and published here on purpose:
      # a secret in a repository is fine for a secret whose entire job is to let
      # someone start a demo, and a disaster for any other kind. Override it by
      # putting a real value in .env or the environment; compose prefers an
      # environment variable over the default below.
      SESSION_SECRET: ${SESSION_SECRET:-dogfood-local-demo-only-4Yq7vN2kZx9TbWm3PdRf8HgLcJ6Qs1EuXa5Vi0No}
      SESSION_SECURE_COOKIES: ${SESSION_SECURE_COOKIES:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_PRETTY: ${LOG_PRETTY:-false}
      # Seeds the demo dataset on first boot. Convenient for a first run and a
      # screenshot; set to false for a real event, because it creates accounts
      # that all share a published password.
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      AUTO_SEED: ${AUTO_SEED:-true}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    volumes:
      # Named volume, not a bind mount: a bind mount into the container risks
      # SQLite's locking behaviour on filesystems that do not support the
      # POSIX advisory locks it depends on (some network and Docker Desktop
      # setups), which fails in ways that look like data corruption.
      - verdict-data:/data
    healthcheck:
      # /api/ready, not /api/health. /api/health returns 200 even with a corrupt
      # database (body `status: "degraded"`), which is right for liveness but
      # wrong for orchestration: a container that cannot query its own data would
      # be reported healthy, never restarted, and would keep receiving traffic.
      # /api/ready returns 503 until migrations have run and the database answers.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # The app drains in-flight requests and closes SQLite cleanly on SIGTERM,
    # with its own 10s force-exit timer (SHUTDOWN_GRACE_MS in server.ts). Docker's
    # default 10s stop grace equals that exactly, so the two race and the
    # container is usually SIGKILLed mid-checkpoint. 20s gives the app room to
    # finish its own shutdown on its own terms.
    stop_grace_period: 20s
    # A single SQLite writer does not benefit from being scaled horizontally, and
    # scaling it out would break the WAL locking the whole integrity story rests
    # on. One container, one volume, one database file.
    deploy:
      replicas: 1

volumes:
  verdict-data:
    name: verdict-data
